# Unity members the shim must provide, grouped by subsystem (BevyMigration/docs/README.md § 6).
# Generated once by Explorer.Net/tools/api-inventory, maintained by hand afterwards: members enter through a
# human-approved PR that also adds the shim implementation and its conformance recording; they leave through a
# refactor inside Unity that moves them to removed_by_refactor so they are not re-introduced.
# Phases: A rendering, B shim, C UI (not shimmed, removed by step 8), D content, F deferred to step 11.
# `api-inventory check` fails on any member used outside this file or listed under removed_by_refactor.

