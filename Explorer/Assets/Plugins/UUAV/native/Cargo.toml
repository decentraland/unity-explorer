[package]
name = "uuav"
version = "0.2.0"
edition = "2024"

# Root-package workspace: `cargo build --release` from this directory still
# builds only `uuav`, so build.sh and .github/workflows/uuav-native.yml keep
# producing the shipped artifacts with today's command. The root cannot move
# higher - a member's .cargo/config.toml is silently ignored when cargo runs
# from a root above it, which would drop FFMPEG_DIR, target-dir, control-flow-
# guard, +crt-static and the @loader_path rpath.
[workspace]
members = [
    "crates/uuav-abi",
    "crates/uuav-adapter",
    "crates/uuav-client",
    "crates/uuav-ipc",
]
exclude = [".target", ".third_party"]

[workspace.package]
version = "0.2.0"

[dependencies]
anyhow = "1.0.98"
arc-swap = "1.7.1"
crossbeam-channel = "0.5.16"
dashmap = "6.1.0"

# NOTE: ffmpeg-next 8.1.0 does not compile against the bundled FFmpeg 8.1
# headers (deprecated AVCodec fields removed, new side-data enum variants),
# so the player is built directly on the sys bindings.
ffmpeg-sys-next = "8.1.0"

libc = "0.2"
parking_lot = "0.12"
ringbuf = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

# objc2 over the old gfx-rs `metal` crate: actively maintained, and its
# Retained<T> RAII with Option-returning constructors fits the crate's
# no-panic rule (the metal crate panics internally).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# the objc2-io-surface feature unlocks the IOSurface bridging APIs
# (newTextureWithDescriptor:iosurface:plane:, CVPixelBufferGetIOSurface)
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-core-video = { version = "0.3", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3"

[lib]
name = "uuav"
# `rlib` only: uuav-adapter links it, and since the M6 cutover the shipped
# `uuav` cdylib is produced by uuav-client instead.
crate-type = ["rlib"]

# A workspace ignores `[profile]` in a non-root member, so the debug info
# uuav-ipc used to ask for itself is expressed here. It is deliberately not a
# plain `[profile.release]`: that would put debug info in the shipped core
# cdylib and push it toward the CI size caps.
[profile.release.package.uuav-ipc]
debug = 1

# The shipped client cdylib - the artifact Unity loads. Same reasoning: a crash
# inside it is only actionable with line tables.
[profile.release.package.uuav-client]
debug = 1

# The adapter is a shipped executable that runs untrusted media; a crash report
# from it is only actionable with line tables. Same reasoning, same reason it is
# not a plain `[profile.release]`.
[profile.release.package.uuav-adapter]
debug = 1
