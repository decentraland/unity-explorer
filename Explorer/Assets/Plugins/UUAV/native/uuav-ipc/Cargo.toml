[package]
name = "uuav-ipc"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
postcard = { version = "1.1", features = ["alloc", "use-std"] }
serde = { version = "1.0", features = ["derive"] }
# links the machine-built shared libzmq from .third_party/libzmq (see
# scripts/build-libzmq.sh; discovery via LIBZMQ_* env in .cargo/config.toml).
# Pinned to 0.9.2: the 0.10 line dropped external-lib linking (its zmq-sys
# always builds a vendored static libzmq).
zmq = { version = "=0.9.2", default-features = false }

# mach message plumbing for the IOSurface port channel (zmq cannot carry
# mach port rights)
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"
