[package]
name = "uuav-ipc"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
postcard = { version = "1.1", features = ["alloc", "use-std"] }
serde = { version = "1.0", features = ["derive"] }

# native transport: message-mode named pipe (overlapped I/O)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

# native transport: AF_UNIX socketpair; mach message plumbing for the
# IOSurface port channel (fds cannot carry mach port rights)
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.4"
