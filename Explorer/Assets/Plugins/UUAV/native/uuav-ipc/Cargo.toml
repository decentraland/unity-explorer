[package]
name = "uuav-ipc"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
postcard = { version = "1.1", features = ["alloc", "use-std"] }
serde = { version = "1.0", features = ["derive"] }
# vendored: libzmq is built from source and statically linked, so neither the
# client dylib nor the helper ships an extra library (LGPL linking exception).
# Pinned to 0.9.2: the 0.10 line removed the vendored/static build entirely.
zmq = { version = "=0.9.2", features = ["vendored"] }
