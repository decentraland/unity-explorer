[package]
name = "uuav-client"
version = "0.2.0"
edition = "2024"

# ships under the same artifact name as the old in-process plugin so the
# C# DllImport("uuav") bindings stay byte-identical; rlib exists only so
# examples/smoke.rs can link the same code for headless verification
[lib]
name = "uuav"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.98"
arc-swap = "1.7.1"
crossbeam-channel = "0.5.16"
dashmap = "6.1.0"
uuav-ipc = { path = "../uuav-ipc" }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.4"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-io-surface = { version = "0.3", features = ["libc", "objc2-core-foundation"] }
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
] }
