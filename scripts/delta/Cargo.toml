[package]
name = "delta"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Per-file HDiffPatch delta updates for Explorer releases (docs/delta-updates.md)"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
hex = "=0.4.3"
nutype = { version = "=0.8.0", features = ["serde"] }
relative-path = "=2.0.1"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tar = "=0.4.46"
tempfile = "=3.27.0"
walkdir = "=2.5.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
rstest = { version = "=0.27.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Internal binary crate: no public API documentation to keep in sync.
missing_errors_doc = "allow"
must_use_candidate = "allow"
# No panics anywhere, tests included: failures are values (anyhow::Result).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
exit = "deny"
