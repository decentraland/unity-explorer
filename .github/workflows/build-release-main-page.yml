name: Create Page Weekly Release

on:
  workflow_run:
    # workflow_run matches by workflow *name* only — a file path here never
    # matches anything.
    workflows:
      - Unity Cloud Build Release
    types:
      - completed

jobs:
  get-info:
    name: Get Info
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_version: ${{ steps.get_version.outputs.next_tag_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: 'main'

      - name: Get version
        id: get_version
        uses: ./.github/actions/version
        
  generate-release-info:
    name: Generate release info
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: get-info
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: 'main'

      - name: Apply tag to branch
        run: |
          TAG=${{ needs.get-info.outputs.tag_version }}
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping tag creation."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: Decentraland_.*
          name_is_regexp: true
          skip_unpack: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true # Swap to auto-release!
          # No target_commitish: the tag was created and pushed on main above,
          # so the release resolves to it. github.sha here is the DEFAULT
          # branch head (dev) — workflow_run events run in that context — and
          # must not be used as the release target.
          tag_name: ${{ needs.get-info.outputs.tag_version }}
          files: |
            ./Decentraland_windows64.zip
            ./Decentraland_macos.zip
            ./Decentraland_windows64_epic.zip
            ./Decentraland_macos_epic.zip
          fail_on_unmatched_files: true
