# pr-comment-artifact-url.yml
---
name: Comment Artifact URL on PR

# Writes the "build" section of the unified CI status comment via the
# ci-status-comment composite action, plus the "performance" section's dispatch
# status (the comment holds build / lint / tests / performance / automation).
#
# 'requested' -> reset the build section to "pending" the moment a new build
#                starts, so last build's download links never linger as stale.
# 'completed' -> fill the section back in: Success (with artifact links) /
#                Failed / Skipped (no changes under Explorer/).
on:
  workflow_run:
    types:
      - "requested"
      - "completed"
    workflows:
      - "Unity Cloud Build"
    branches-ignore:
      - "main"
  workflow_dispatch:
permissions:
  contents: read  
  pull-requests: write

jobs:
  pre-validation:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.check-pr.outputs.pr-number }}
    steps:
      - name: Check if PR number exists
        id: check-pr
        env:
          WORKFLOW_RUN_EVENT_OBJ: ${{ toJSON(github.event.workflow_run) }}
        run: |
          PR_NUMBER=$(jq -r '.pull_requests[0].number' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "Pull request Number: $PR_NUMBER"
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "PR_NUMBER is not set, skipping comment update."
            exit 0
          fi
          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

  comment-pending:
    needs: pre-validation
    if: github.event.action == 'requested' && needs.pre-validation.outputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI status action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/ci-status-comment
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Reset build section to pending
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ needs.pre-validation.outputs.pr-number }}
          section: build
          github-token: ${{ github.token }}
          body: |-
            [![Build](https://img.shields.io/badge/Build-Pending!-yellow?logo=github&style=for-the-badge)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})

            New build in progress — per-platform Unity Cloud links land here as soon as each build is created.

  check-build-ran:
    needs: pre-validation
    if: github.event.action == 'completed' && needs.pre-validation.outputs.pr-number != ''
    runs-on: ubuntu-latest
    outputs:
      build-ran: ${{ steps.check.outputs.build-ran }}
      player-artifacts: ${{ steps.check.outputs.player-artifacts }}
    steps:
      - name: Check if build jobs actually ran
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # player-artifacts: Decentraland_* zips exist. comment-success interpolates
          # their artifact ids into download URLs, so the success/skipped split must
          # keep gating on this and only this.
          # build-ran: any evidence a Unity-side build started. unity_build_info_* is
          # uploaded as soon as the build id is known, so a build that failed before
          # producing player artifacts still posts a failure comment (with the Unity
          # Cloud link) instead of leaving the comment stuck on "Pending".
          # per_page=100: the default page holds 30 and a two-target run already
          # uploads ~a dozen artifacts — unity_build_info_* falling off page 1
          # would read as build-ran=false, the exact stuck-on-Pending bug the
          # flag exists to prevent.
          NAMES=$(gh api "/repos/$OWNER/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[].name]')
          PLAYER_COUNT=$(jq 'map(select(startswith("Decentraland_"))) | length' <<< "$NAMES")
          INFO_COUNT=$(jq 'map(select(startswith("unity_build_info_"))) | length' <<< "$NAMES")
          echo "Player artifact count: $PLAYER_COUNT; build info artifact count: $INFO_COUNT"
          if [ "$PLAYER_COUNT" -gt 0 ]; then
            echo "player-artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "player-artifacts=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PLAYER_COUNT" -gt 0 ] || [ "$INFO_COUNT" -gt 0 ]; then
            echo "build-ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "build-ran=false" >> "$GITHUB_OUTPUT"
          fi

  comment-skipped:
    needs: [pre-validation, check-build-ran]
    if: github.event.workflow_run.conclusion == 'success' && needs.pre-validation.outputs.pr-number != '' && needs.check-build-ran.outputs.player-artifacts == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI status action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/ci-status-comment
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Post skipped build section
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ needs.pre-validation.outputs.pr-number }}
          section: build
          github-token: ${{ github.token }}
          body: |-
            [![Build](https://img.shields.io/badge/Build-Skipped-yellow?logo=unity&logoColor=white&style=for-the-badge)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})

            Build skipped — no changes detected under `Explorer/`.

  comment-success:
    needs: [pre-validation, check-build-ran]
    if: github.event.workflow_run.conclusion == 'success' && needs.pre-validation.outputs.pr-number != '' && needs.check-build-ran.outputs.player-artifacts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI status action
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/actions/ci-status-comment
            .github/actions/ucb-build-links
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Get Artifact and Pull request info
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_EVENT_OBJ: ${{ toJSON(github.event.workflow_run) }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          PREVIOUS_JOB_ID=$(jq -r '.id' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "Previous Job ID: $PREVIOUS_JOB_ID"
          echo "PREVIOUS_JOB_ID=$PREVIOUS_JOB_ID" >> "$GITHUB_ENV"

          SUITE_ID=$(jq -r '.check_suite_id' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "Previous Suite ID: $SUITE_ID"
          echo "SUITE_ID=$SUITE_ID" >> "$GITHUB_ENV"

          WINDOWS_ARTIFACT_ID=$(gh api "/repos/$OWNER/$REPO/actions/artifacts" \
            --jq ".artifacts.[] |
            select(.workflow_run.id==${PREVIOUS_JOB_ID}) |
            select(.expired==false) |
            select(.name==\"Decentraland_windows64\") |
            .id")
          echo "Windows Artifact ID: $WINDOWS_ARTIFACT_ID"
          echo "WINDOWS_ARTIFACT_ID=$WINDOWS_ARTIFACT_ID" >> "$GITHUB_ENV"

          MAC_ARTIFACT_ID=$(gh api "/repos/$OWNER/$REPO/actions/artifacts" \
            --jq ".artifacts.[] |
            select(.workflow_run.id==${PREVIOUS_JOB_ID}) |
            select(.expired==false) |
            select(.name==\"Decentraland_macos\") |
            .id")
          echo "Mac Artifact ID: $MAC_ARTIFACT_ID"
          echo "MAC_ARTIFACT_ID=$MAC_ARTIFACT_ID" >> "$GITHUB_ENV"

          ORIGINAL_EVENT=$(jq -r '.event' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "Original Event: $ORIGINAL_EVENT"

          HEAD_SHA=$(jq -r '.pull_requests[0].head.sha // .head_sha' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "Head SHA: $HEAD_SHA"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

          SHORT_SHA=$(echo "$HEAD_SHA" | cut -c1-7)
          echo "Short SHA: $SHORT_SHA"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

          SAFE_BRANCH_NAME=$(jq -r '.pull_requests[0].head.ref // .head_branch' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "Safe Branch Name: $SAFE_BRANCH_NAME"
          echo "SAFE_BRANCH_NAME=$SAFE_BRANCH_NAME" >> "$GITHUB_ENV"

          RUN_NUMBER=$(jq -r '.run_number' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "Run number: $RUN_NUMBER"
          echo "RUN_NUMBER=$RUN_NUMBER" >> "$GITHUB_ENV"

          case "$ORIGINAL_EVENT" in
            pull_request) BUILD_PREFIX="pr" ;;
            push) BUILD_PREFIX="pu" ;;
            merge_group) BUILD_PREFIX="mg" ;;
            workflow_dispatch) BUILD_PREFIX="wd" ;;
            workflow_call) BUILD_PREFIX="wc" ;;
            schedule) BUILD_PREFIX="sc" ;;
            *) BUILD_PREFIX="gn" ;;
          esac
          echo "Build Prefix: $BUILD_PREFIX"

          ARTIFACT_S3_DESTINATION_PATH="@dcl/$REPO/branch/$SAFE_BRANCH_NAME/${BUILD_PREFIX}-${RUN_NUMBER}-${SHORT_SHA}"
          echo "Artifact S3 Destination Path: $ARTIFACT_S3_DESTINATION_PATH"
          echo "ARTIFACT_S3_DESTINATION_PATH=$ARTIFACT_S3_DESTINATION_PATH" >> "$GITHUB_ENV"

          BUILD_DATE=$(jq -r '.updated_at' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "Build done on: $BUILD_DATE"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

      - name: Download size reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          gh run download "$PREVIOUS_JOB_ID" \
            --repo "$OWNER/$REPO" \
            --name size_report_windows64_launcher \
            --dir size_reports 2>/dev/null || true
          gh run download "$PREVIOUS_JOB_ID" \
            --repo "$OWNER/$REPO" \
            --name size_report_macos_launcher \
            --dir size_reports 2>/dev/null || true

          WINDOWS_ROW=$(grep "^|" size_reports/size_report_windows64_launcher.md 2>/dev/null || true)
          MACOS_ROW=$(grep "^|" size_reports/size_report_macos_launcher.md 2>/dev/null || true)
          RELEASE_TAG=$(grep "^release_tag=" size_reports/size_report_windows64_launcher.md size_reports/size_report_macos_launcher.md 2>/dev/null | head -1 | cut -d= -f2 || true)

          if [ -n "$WINDOWS_ROW" ] || [ -n "$MACOS_ROW" ]; then
            {
              echo "SIZE_REPORT<<EOF"
              echo "### Artifact size check"
              echo ""
              echo "| Target | Size (MB / MiB) | Cap (MB) | Δ MB vs release | Δ % vs release | Result |"
              echo "|--------|----------------:|--------:|----------------:|---------------:|--------|"
              [ -n "$WINDOWS_ROW" ] && echo "$WINDOWS_ROW"
              [ -n "$MACOS_ROW" ] && echo "$MACOS_ROW"
              [ -n "$RELEASE_TAG" ] && echo "" && echo "_Comparing against: **${RELEASE_TAG}**_"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            echo "SIZE_REPORT=" >> "$GITHUB_ENV"
          fi

      - name: Fetch Unity Cloud build links
        id: ucb
        uses: ./.github/actions/ucb-build-links
        with:
          run-id: ${{ env.PREVIOUS_JOB_ID }}
          github-token: ${{ github.token }}
          install-source: launcher

      # One row per platform: GitHub job · Unity Cloud build · Unity log ·
      # build duration · zip downloads. Composed here rather than inline in the
      # body so a link whose id could not be resolved is dropped instead of
      # rendering broken.
      - name: Compose platform rows
        env:
          WINDOWS_CELL: ${{ steps.ucb.outputs.windows-cell }}
          MAC_CELL: ${{ steps.ucb.outputs.mac-cell }}
          S3_BASE: ${{ format('{0}/{1}', vars.EXPLORER_TEAM_S3_BUCKET_PUBLIC_URL, env.ARTIFACT_S3_DESTINATION_PATH) }}
        run: |
          set -euo pipefail
          compose_row() {
            local label="$1" cell="$2" art_id="$3" file="$4"
            local parts=()
            [ -n "$cell" ] && parts+=("$cell")
            [ -n "$art_id" ] && parts+=("[Download .zip](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/suites/${SUITE_ID}/artifacts/${art_id})")
            parts+=("[.zip via S3](${S3_BASE}/${file})")
            local joined
            joined=$(printf '%s · ' "${parts[@]}")
            printf '| %s | %s |\n' "$label" "${joined% · }"
          }
          {
            echo "PLATFORM_ROWS<<PLATFORM_ROWS_EOF"
            compose_row "Windows" "$WINDOWS_CELL" "${WINDOWS_ARTIFACT_ID:-}" "Decentraland_windows64.zip"
            compose_row "Mac" "$MAC_CELL" "${MAC_ARTIFACT_ID:-}" "Decentraland_macos.zip"
            echo "PLATFORM_ROWS_EOF"
          } >> "$GITHUB_ENV"

      - name: Update build section
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ needs.pre-validation.outputs.pr-number }}
          section: build
          github-token: ${{ github.token }}
          body: |-
            [![Build](https://img.shields.io/badge/Build-Success!-3fb950?logo=unity&logoColor=white&style=for-the-badge)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ env.PREVIOUS_JOB_ID }})

            Windows and Mac built successfully in Unity Cloud.

            | Name | Links & timing |
            | -------- | ----------------------- |
            | Build | [`${{ env.SHORT_SHA }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ env.HEAD_SHA }}) · [Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ env.PREVIOUS_JOB_ID }}) · built ${{ env.BUILD_DATE }} |
            ${{ env.PLATFORM_ROWS }}

            ${{ env.SIZE_REPORT }}

      - name: Find latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release view -R $GITHUB_REPOSITORY --json tagName --template "RELEASE_TAG={{.tagName}}" >> $GITHUB_ENV

      - name: Trigger performance test
        id: perf_dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          repository: decentraland/performance-testing
          event-type: unity-explorer
          token: ${{ secrets.PERFORMANCE_TESTING_PAT }}
          # Fork-controlled fields (display_title, and the branch name inside
          # ARTIFACT_S3_DESTINATION_PATH) are wrapped in toJSON so they are JSON-escaped
          # rather than spliced raw into the payload — a title/branch containing a quote
          # can't break out of its string and inject or override other fields.
          client-payload: |-
            {
              "run_name": ${{ toJSON(github.event.workflow_run.display_title) }},
              "pr_number": "${{ needs.pre-validation.outputs.pr-number }}",
              "win_change_build_url": ${{ toJSON(format('{0}/{1}/Decentraland_windows64.zip', vars.EXPLORER_TEAM_S3_BUCKET_PUBLIC_URL, env.ARTIFACT_S3_DESTINATION_PATH)) }},
              "win_base_build_url": "${{ vars.EXPLORER_TEAM_S3_BUCKET_PUBLIC_URL }}/@dcl/unity-explorer/releases/${{ env.RELEASE_TAG }}/Decentraland_windows64.zip",
              "mac_change_build_url": ${{ toJSON(format('{0}/{1}/Decentraland_macos.zip', vars.EXPLORER_TEAM_S3_BUCKET_PUBLIC_URL, env.ARTIFACT_S3_DESTINATION_PATH)) }},
              "mac_base_build_url": "${{ vars.EXPLORER_TEAM_S3_BUCKET_PUBLIC_URL }}/@dcl/unity-explorer/releases/${{ env.RELEASE_TAG }}/Decentraland_macos.zip"
            }

      # The PAT's remaining lifetime comes back as a response header on any API
      # call it makes; surfacing it in the status comment replaces a separate
      # expiry canary — an expiring token must warn somewhere a human looks.
      - name: Probe performance PAT expiry
        # Purely decorative — its whole output is one optional sentence, so it
        # must never gate the dispatched/dispatch-failed section writes below.
        if: steps.perf_dispatch.outcome == 'success'
        continue-on-error: true
        env:
          PAT: ${{ secrets.PERFORMANCE_TESTING_PAT }}
        run: |
          set -euo pipefail
          # The expiry header rides every authenticated call; /rate_limit spends
          # no quota and names no repo that could drift. gh reads the token from
          # the environment, keeping it out of any process's argv. head -1 keeps
          # $GITHUB_ENV single-line even if the response ever repeats the header.
          exp=$(GH_TOKEN="$PAT" timeout 15 gh api --include --method HEAD /rate_limit 2>/dev/null \
            | tr -d '\r' | grep -i '^github-authentication-token-expiration:' | head -1 | cut -d' ' -f2- || true)
          msg=""
          if [ -n "$exp" ]; then
            exp_s=$(date -d "$exp" +%s 2>/dev/null || echo 0)
            if [ "$exp_s" -gt 0 ]; then
              days=$(( (exp_s - $(date +%s)) / 86400 ))
              echo "PERFORMANCE_TESTING_PAT expires in $days days ($exp)"
              if [ "$days" -lt 30 ]; then
                msg="⚠️ \`PERFORMANCE_TESTING_PAT\` expires in **$days days** ($exp) — rotate it before benchmark dispatches start failing."
              fi
            fi
          else
            echo "::warning::No github-authentication-token-expiration header returned — PAT expiry cannot be monitored."
          fi
          echo "PAT_EXPIRY_WARNING=$msg" >> "$GITHUB_ENV"

      # repository_dispatch is fire-and-forget (no run id comes back), so this
      # links the target workflow's run list; the benchmark itself posts a
      # separate perf-test-summary comment with its run link when it finishes.
      - name: Mark performance section as dispatched
        if: steps.perf_dispatch.outcome == 'success'
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ needs.pre-validation.outputs.pr-number }}
          section: performance
          github-token: ${{ github.token }}
          body: |-
            [![Performance](https://img.shields.io/badge/Performance-Dispatched!-yellow?logo=speedtest&logoColor=white&style=for-the-badge)](https://github.com/decentraland/performance-testing/actions/workflows/unity-explorer.yaml)

            🏁 Bare-metal benchmark dispatched for this build ([run queue](https://github.com/decentraland/performance-testing/actions/workflows/unity-explorer.yaml)) — results across the runner fleet will be posted as a separate `perf-test-summary` comment.

            <sub>Latest build wins this section — it also replaces any earlier `perf_test`-suite verdict.</sub>

            ${{ env.PAT_EXPIRY_WARNING }}

      # A failing dispatch (e.g. an expired PERFORMANCE_TESTING_PAT) turns this
      # job red but leaves no trace on the PR; surface it in the performance
      # section so it cannot go unnoticed.
      # outcome != 'success' rather than == 'failure': anything failing between
      # the checkout and the dispatch (Find latest release, the build-section
      # upsert) skips perf_dispatch, and a skipped dispatch is the same silence
      # on the PR as a failed one.
      - name: Mark performance section as dispatch-failed
        if: failure() && steps.perf_dispatch.outcome != 'success'
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ needs.pre-validation.outputs.pr-number }}
          section: performance
          github-token: ${{ github.token }}
          body: |-
            [![Performance](https://img.shields.io/badge/Performance-Dispatch%20failed-ff0000?logo=speedtest&logoColor=white&style=for-the-badge)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ❌ Could not dispatch the bare-metal benchmark (the job failed before or during the dispatch) — see the [step log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). If it says "Repository not found, OR token has insufficient permissions", the `PERFORMANCE_TESTING_PAT` secret has expired and needs to be rotated.

  comment-failed:
    needs: [pre-validation, check-build-ran]
    if: github.event.workflow_run.conclusion == 'failure' && needs.pre-validation.outputs.pr-number != '' && needs.check-build-ran.outputs.build-ran == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI status action
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/actions/ci-status-comment
            .github/actions/ucb-build-links
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Fetch Unity Cloud build links
        id: ucb
        uses: ./.github/actions/ucb-build-links
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          install-source: launcher

      - name: Update build section
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ needs.pre-validation.outputs.pr-number }}
          section: build
          github-token: ${{ github.token }}
          body: |-
            [![Build](https://img.shields.io/badge/Build-Failed!-ff0000?logo=unity&logoColor=white&style=for-the-badge)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})

            Build failed! Check the [logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}) to see what went wrong.
            If the error repeats please consider the `clean-build` tag.

            ${{ steps.ucb.outputs.section }}
