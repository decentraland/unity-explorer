name: Create Release Branch and PR

on:
  workflow_dispatch:

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: dev
          
      - name: Get release date and branch name
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          echo "RELEASE_DATE=$RELEASE_DATE" >> $GITHUB_ENV
          echo "BRANCH_NAME=release/$RELEASE_DATE" >> $GITHUB_ENV

      - name: Create or update branch
        run: |
          git checkout -B $BRANCH_NAME
          git push --force --set-upstream origin $BRANCH_NAME

      - name: Create pull request using GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create PR if it doesn't already exist
          if ! gh pr view "$BRANCH_NAME" --json number &>/dev/null; then
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "release: $RELEASE_DATE" \
              --body ":rocket: Automated release PR"
          fi

          # Always ensure labels are applied (handles 502 / retry scenarios)
          gh pr edit "$BRANCH_NAME" --add-label "release,auto-pr"

      - name: Fill the CI status comment from dev's runs of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_URL_PREFIX: ${{ vars.EXPLORER_TEAM_S3_BUCKET_PUBLIC_URL }}
        run: |
          set -euo pipefail

          # Bot-created PRs trigger no workflows, so nothing on this PR ever
          # writes the unified CI status comment: every section would sit on the
          # skeleton's "Waiting…" placeholder for the life of the release, each
          # one describing a run that is never coming. The branch is cut from
          # dev's tip, whose SHA dev already built, linted and tested — fill the
          # sections from those runs instead.
          #
          # Sections rather than a standalone comment: a standalone one has no
          # update path, so the next push to the release branch left the cut
          # commit's download links sitting on the page and testers kept
          # installing them. The build workflow overwrites this section.
          PR_NUMBER=$(gh pr view "$BRANCH_NAME" --json number --jq '.number')
          HEAD_SHA=$(git rev-parse HEAD)
          SHORT_SHA="${HEAD_SHA:0:7}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          ACTIONS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"

          upsert() {
            SECTION="$1" SECTION_BODY_FILE="$2" REPO="$GITHUB_REPOSITORY" PR_NUMBER="$PR_NUMBER" \
              bash .github/actions/ci-status-comment/upsert-ci-status.sh
          }

          # The helper the InWorld gate step below also defines, written twice
          # for the reason stated there: a step cannot export a shell function
          # to the next one. What it buys here is the distinction between "the
          # API says there is no run" and "the API did not answer" — the latter
          # left to set -e would kill this step and take the gate with it, and
          # reported as the former it would send the release manager off to
          # rebuild a commit that is already built.
          gh_api_retry() {
            local out attempt
            for attempt in 1 2 3; do
              if [ "$attempt" -lt 3 ]; then
                if out=$(gh api "$@" 2>/dev/null); then printf '%s' "$out"; return 0; fi
                sleep 5
              else
                if out=$(gh api "$@"); then printf '%s' "$out"; return 0; fi
              fi
            done
            return 1
          }

          BUILD_STYLE="?logo=unity&logoColor=white&style=for-the-badge"
          BUILD_RUNS="${ACTIONS_URL}/workflows/build-unitycloud.yml"

          # Scoped to the build workflow file — a repo-wide head_sha listing
          # gets crowded out by bot runs sharing the SHA and the build falls
          # past the first page.
          BUILD_LISTED=1
          RUN_JSON=$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/workflows/build-unitycloud.yml/runs?head_sha=${HEAD_SHA}&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "pull_request" or .event == "push")] | .[0]') || BUILD_LISTED=0

          if [ "$BUILD_LISTED" = "0" ]; then
            {
              echo "![Build](https://img.shields.io/badge/Build-Unknown-lightgrey${BUILD_STYLE})"
              echo ""
              echo "The Actions API did not answer when listing builds of \`${SHORT_SHA}\`, so whether one exists is unknown — this is not evidence that there is none. Read the [build runs](${BUILD_RUNS}) before deciding to rebuild."
            } > build.md
            upsert build build.md
          elif [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
            {
              echo "![Build](https://img.shields.io/badge/Build-Not%20Found-yellow${BUILD_STYLE})"
              echo ""
              echo "No successful Unity Cloud build of \`${SHORT_SHA}\` exists, so there is nothing to link here — see the [build runs](${BUILD_RUNS}). Label this PR \`force-build\` to build the release branch. Do not re-run *Create Release Branch and PR*: it force-pushes \`${BRANCH_NAME}\` from dev's current tip, re-cutting the release from commits nobody reviewed for it."
            } > build.md
            upsert build build.md
          else
            RUN_ID=$(jq -r '.id' <<< "$RUN_JSON")
            RUN_NUMBER=$(jq -r '.run_number' <<< "$RUN_JSON")
            SUITE_ID=$(jq -r '.check_suite_id' <<< "$RUN_JSON")
            RUN_EVENT=$(jq -r '.event' <<< "$RUN_JSON")
            RUN_BRANCH=$(jq -r '.head_branch' <<< "$RUN_JSON")
            BUILD_DATE=$(jq -r '.updated_at' <<< "$RUN_JSON")

            # Same event -> S3 prefix mapping as build-unitycloud.yml
            case "$RUN_EVENT" in
              pull_request) BUILD_PREFIX="pr" ;;
              push) BUILD_PREFIX="pu" ;;
              merge_group) BUILD_PREFIX="mg" ;;
              workflow_dispatch) BUILD_PREFIX="wd" ;;
              workflow_call) BUILD_PREFIX="wc" ;;
              schedule) BUILD_PREFIX="sc" ;;
              *) BUILD_PREFIX="gn" ;;
            esac

            S3_BASE="${PUBLIC_URL_PREFIX}/@dcl/${REPO_NAME}/branch/${RUN_BRANCH}/${BUILD_PREFIX}-${RUN_NUMBER}-${SHORT_SHA}"
            ARTIFACTS=$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts") || ARTIFACTS='{"artifacts":[]}'

            # One row per platform, the artifact link dropped when its id could
            # not be resolved — a link built on an empty id renders as a
            # download that 404s, which reads worse than no link at all.
            platform_row() {
              local label="$1" artifact_name="$2" zip="$3" id parts
              id=$(jq -r --arg n "$artifact_name" 'first(.artifacts[]? | select(.name == $n) | .id) // empty' <<< "$ARTIFACTS")
              parts="[.zip via S3](${S3_BASE}/${zip})"
              if [ -n "$id" ]; then
                parts="[Download .zip](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/suites/${SUITE_ID}/artifacts/${id}) · ${parts}"
              fi
              printf '| %s | %s |\n' "$label" "$parts"
            }

            {
              echo "[![Build](https://img.shields.io/badge/Build-Success!-3fb950${BUILD_STYLE})](${ACTIONS_URL}/runs/${RUN_ID})"
              echo ""
              echo "Windows and Mac built successfully in Unity Cloud. Links reused from the \`${RUN_BRANCH}\` build of this commit — the release branch was cut from it, so its artifacts are the release's."
              echo ""
              echo "| Name | Links & timing |"
              echo "| -------- | ----------------------- |"
              echo "| Build | [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${HEAD_SHA}) · [Logs](${ACTIONS_URL}/runs/${RUN_ID}) · built ${BUILD_DATE} |"
              platform_row "Windows" "Decentraland_windows64" "Decentraland_windows64.zip"
              platform_row "Mac" "Decentraland_macos" "Decentraland_macos.zip"
            } > build.md
            upsert build build.md
          fi

          # dev's "Unity Test" run for the same SHA carries the only lint and
          # test evidence this release will ever have: the PR's own events
          # start nothing, and nothing but a force-build label will change that.
          #
          # Three outcomes, kept apart for the same reason the InWorld gate
          # below keeps LISTED apart from UNEXAMINED: "the suite did not run"
          # and "the API would not say" are opposite instructions to whoever
          # reads the section, and only one of them is about this release.
          TEST_RUN_URL=""
          TEST_JOBS=""
          TEST_STATE=unknown
          if TEST_RUN=$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${HEAD_SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "pull_request")] | .[0]'); then
            if [ -z "$TEST_RUN" ] || [ "$TEST_RUN" = "null" ]; then
              # test.yml is path-filtered on pushes to dev, so a commit that
              # touches nothing the suite watches starts no run at all — an
              # absence the API is certain about, not one it failed to report.
              TEST_STATE=norun
            else
              TEST_RUN_ID=$(jq -r '.id' <<< "$TEST_RUN")
              TEST_RUN_URL=$(jq -r '.html_url' <<< "$TEST_RUN")
              if TEST_JOBS=$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/runs/${TEST_RUN_ID}/jobs?per_page=100"); then
                TEST_STATE=ok
              fi
            fi
          fi

          # "" for a job the run never created, which is not the same as a job
          # that ran and concluded — the callers below separate the two.
          job_conclusion() {
            jq -r --arg n "$1" '[.jobs[] | select(.name == $n) | .conclusion] | .[0] // ""' <<< "$TEST_JOBS"
          }

          # Every reused section says so, and says it will not update: read
          # without that line a green badge on a release PR looks like the PR's
          # own result, and the first push to the branch silently makes it one.
          REUSED="<sub>Reused from dev's [\`Unity Test\` run](${TEST_RUN_URL}) of \`${SHORT_SHA}\`, the commit this release was cut from. The release PR starts no runs of its own until something pushes to the branch.</sub>"

          TEST_RUNS="${ACTIONS_URL}/workflows/test.yml"
          LINT_STYLE="?logo=jetbrains&logoColor=white&style=for-the-badge"
          LINT_NOTE=""
          if [ "$TEST_STATE" = "norun" ]; then
            LINT_BADGE="![Lint](https://img.shields.io/badge/Lint-Not%20run-lightgrey${LINT_STYLE})"
            LINT_MSG="No \`Unity Test\` run exists for \`${SHORT_SHA}\`: the commit this release was cut from touches nothing the suite watches, so lint never ran on it."
          elif [ "$TEST_STATE" = "unknown" ]; then
            LINT_BADGE="![Lint](https://img.shields.io/badge/Lint-Unknown-lightgrey${LINT_STYLE})"
            LINT_MSG="The Actions API did not answer for \`${SHORT_SHA}\`'s \`Unity Test\` run, so the warning count at the cut is unknown — this is not evidence that lint never ran. See the [test runs](${TEST_RUNS})."
          else
            LINT_CONCLUSION=$(job_conclusion "Lint")
            LINT_NOTE="$REUSED"
            case "$LINT_CONCLUSION" in
              success)
                LINT_BADGE="[![Lint](https://img.shields.io/badge/Lint-Passed!-3fb950${LINT_STYLE})](${TEST_RUN_URL})"
                LINT_MSG="Lint succeeded on dev's run of this commit. The ratchet itself gates PRs into dev rather than release cuts — every commit on this branch already passed it there." ;;
              skipped|"")
                LINT_BADGE="[![Lint](https://img.shields.io/badge/Lint-Skipped-lightgrey${LINT_STYLE})](${TEST_RUN_URL})"
                LINT_MSG="No C# files changed in the commit this release was cut from — the ratchet did not run." ;;
              *)
                LINT_BADGE="[![Lint](https://img.shields.io/badge/Lint-Unavailable-ff0000${LINT_STYLE})](${TEST_RUN_URL})"
                LINT_MSG="Lint did not finish (\`${LINT_CONCLUSION}\`) on dev's run of this commit, so the warning count at the cut was never established." ;;
            esac
          fi
          {
            echo "$LINT_BADGE"
            echo ""
            echo "$LINT_MSG"
            if [ -n "$LINT_NOTE" ]; then echo ""; echo "$LINT_NOTE"; fi
          } > lint.md
          upsert lint lint.md

          TESTS_STYLE="?logo=codecov&logoColor=white&style=for-the-badge"
          TESTS_NOTE=""
          if [ "$TEST_STATE" = "norun" ]; then
            TESTS_BADGE="![Tests](https://img.shields.io/badge/Tests-Not%20run-lightgrey${TESTS_STYLE})"
            TESTS_MSG="No \`Unity Test\` run exists for \`${SHORT_SHA}\`: the commit this release was cut from touches nothing the suite watches, so neither suite ran on it."
          elif [ "$TEST_STATE" = "unknown" ]; then
            TESTS_BADGE="![Tests](https://img.shields.io/badge/Tests-Unknown-lightgrey${TESTS_STYLE})"
            TESTS_MSG="The Actions API did not answer for \`${SHORT_SHA}\`'s \`Unity Test\` run, so whether its suites passed is unknown — this is not evidence that they did not. See the [test runs](${TEST_RUNS})."
          else
            EDITMODE=$(job_conclusion "Test (editmode)")
            PLAYMODE=$(job_conclusion "Test (playmode)")
            TESTS_NOTE="$REUSED"
            if [ "$EDITMODE" = "success" ] && [ "$PLAYMODE" = "success" ]; then
              TESTS_BADGE="[![Tests](https://img.shields.io/badge/Tests-Passed!-3fb950${TESTS_STYLE})](${TEST_RUN_URL})"
              TESTS_MSG="Both suites passed on dev's run of this commit ✅"
            elif [ -z "$EDITMODE" ] && [ -z "$PLAYMODE" ]; then
              TESTS_BADGE="[![Tests](https://img.shields.io/badge/Tests-Not%20run-lightgrey${TESTS_STYLE})](${TEST_RUN_URL})"
              TESTS_MSG="Neither suite ran on dev's run of this commit."
            else
              TESTS_BADGE="[![Tests](https://img.shields.io/badge/Tests-Failed!-ff0000${TESTS_STYLE})](${TEST_RUN_URL})"
              TESTS_MSG="A suite did not pass on dev's run of this commit ❌ — editmode \`${EDITMODE:-not run}\`, playmode \`${PLAYMODE:-not run}\`."
            fi
          fi
          {
            echo "$TESTS_BADGE"
            echo ""
            echo "$TESTS_MSG"
            if [ -n "$TESTS_NOTE" ]; then echo ""; echo "$TESTS_NOTE"; fi
          } > tests.md
          upsert tests tests.md

          # The benchmark rides a build of *this* PR — pr-comment-artifact-url
          # dispatches it, and it needs a PR number the dev push's build never
          # had. So the placeholder's promise ("results land in this section")
          # is one nothing on a release cut can keep; say so instead.
          {
            echo "![Performance](https://img.shields.io/badge/Performance-Not%20dispatched-lightgrey?logo=speedtest&logoColor=white&style=for-the-badge)"
            echo ""
            echo "No bare-metal benchmark is dispatched for a release cut: the dispatch rides a build of this PR, and this PR was opened by a token whose events start no workflows. Label it \`force-build\` to build the release branch and get one."
          } > performance.md
          upsert performance performance.md

      # The PR above was opened with GITHUB_TOKEN, whose events start no workflow
      # runs — the same suppression the CI-status step above exists to work around.
      # So the InWorld gate has to be started explicitly, by a token that can.
      #
      # Dispatching against the release branch is what puts the gate on the PR:
      # a workflow_dispatch run attaches its checks to the dispatched ref's tip,
      # and that tip is the PR head. Without this the required check on main
      # never reports and the release cannot merge.
      - name: Start the InWorld gate on the release branch
        env:
          GH_TOKEN: ${{ secrets.ORG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          # On the dispatch path the gate resolves this commit's build with
          # wait-minutes 0, so it fails within seconds unless both zips are
          # already up. Ask it the same question — did both build legs conclude
          # success — rather than whether a run went green: build-unitycloud.yml
          # also concludes green having built nothing, when the commit touches
          # no Explorer/** file and the matrix never expands, and green having
          # built one platform, when a windows-only/macos-only label narrows it.
          # Either would dispatch a gate that immediately reds a brand-new
          # release PR with nothing wrong in it.
          #
          # Runs come back newest first, and only the newest few are worth
          # asking about — the same candidate cap resolve-explorer-build uses.
          HEAD_SHA=$(git rev-parse HEAD)

          # The helper resolve-explorer-build defines, duplicated because a
          # composite action cannot export a shell function to its caller. Same
          # justification, more sharply: this step decides on one answer and
          # then the workflow ends, so a single 5xx must not settle a release
          # cut. Three attempts five seconds apart cover a transport failure —
          # a 5xx, a connection reset — and only that; a spent rate limit
          # refills on an hour boundary, which is why the flags below record
          # whether the API answered rather than trusting the retry to make it.
          # stderr is kept on the last attempt so a permanent failure (this
          # workflow file renamed, say) says what it was instead of vanishing
          # into "the API did not answer".
          gh_api_retry() {
            local out attempt
            for attempt in 1 2 3; do
              if [ "$attempt" -lt 3 ]; then
                if out=$(gh api "$@" 2>/dev/null); then printf '%s' "$out"; return 0; fi
                sleep 5
              else
                if out=$(gh api "$@"); then printf '%s' "$out"; return 0; fi
              fi
            done
            return 1
          }

          # Absorbed rather than left to set -e, here and on the jobs call
          # below: an API blip must not red a cut whose branch, PR, labels and
          # CI status comment have all landed. But it must not be reported as
          # "no build" either — that is the conflation LISTED/LISTED_NOW exist
          # to stop in resolve-explorer-build, and it costs more here, because
          # this message is the operator's only instruction and the workflow
          # ends after it. LISTED is "the run listing answered at all";
          # UNEXAMINED is "a candidate's jobs call did not", which leaves that
          # run neither green nor known to be anything else.
          LISTED=0
          UNEXAMINED=0
          if RUN_IDS=$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/workflows/build-unitycloud.yml/runs?head_sha=${HEAD_SHA}&per_page=50" \
            --jq '[.workflow_runs[] | select(.event == "pull_request" or .event == "push") | .id]'); then
            LISTED=1
          else
            RUN_IDS=''
          fi
          if [ -z "$RUN_IDS" ]; then RUN_IDS='[]'; fi
          LIMIT=$(jq 'length' <<< "$RUN_IDS")
          if [ "$LIMIT" -gt 5 ]; then LIMIT=5; fi

          LEGS_GREEN=false
          for (( i = 0; i < LIMIT; i++ )); do
            RUN_ID=$(jq -r ".[$i]" <<< "$RUN_IDS")
            if LEGS_GREEN=$(gh_api_retry "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=50" \
              --jq '[.jobs[] | select(.conclusion == "success") | .name] | any(startswith("Build (macos")) and any(startswith("Build (windows64"))'); then
              if [ "$LEGS_GREEN" = "true" ]; then break; fi
            else
              LEGS_GREEN=false
              UNEXAMINED=1
            fi
          done

          # Three ways to end up not dispatching, and only the last is a build
          # problem — so they get three messages. All three are `::error::`:
          # each one ends with the gate unreported and the release unmergeable,
          # which is not a line in a green log, and the dispatch failure below
          # already annotates for exactly that outcome.
          #
          # None of them says "re-run this workflow". Re-running re-enters the
          # `Create or update branch` step above, which force-pushes
          # ${BRANCH_NAME} from dev's current tip — quietly re-cutting the
          # release from newer commits than the one that was reviewed. Starting
          # `In-World Tests` by hand is the remedy in every case, and it is the
          # same instruction the dispatch failure below gives.
          if [ "$LISTED" = "0" ]; then
            echo "::error::Could not list build-unitycloud.yml runs for ${HEAD_SHA:0:7} — the GitHub Actions API did not answer, so no build was ever looked at and the InWorld gate was not started. This says nothing about whether a build exists. The release branch and its PR are fine: start \`In-World Tests\` by hand from the Actions tab against ${BRANCH_NAME}. Do not re-run this workflow — it force-pushes ${BRANCH_NAME} and would re-cut the release from a newer dev tip."
            exit 0
          fi
          if [ "$LEGS_GREEN" != "true" ] && [ "$UNEXAMINED" = "1" ]; then
            echo "::error::The GitHub Actions API did not answer for at least one build run of ${HEAD_SHA:0:7}, so whether its legs are green is unknown and the InWorld gate was not started. This is not evidence that no build exists. The release branch and its PR are fine: start \`In-World Tests\` by hand from the Actions tab against ${BRANCH_NAME}. Do not re-run this workflow — it force-pushes ${BRANCH_NAME} and would re-cut the release from a newer dev tip."
            exit 0
          fi
          if [ "$LEGS_GREEN" != "true" ]; then
            echo "::error::No build of ${HEAD_SHA:0:7} has both Build (macos) and Build (windows64) green, so the InWorld gate was not started — it would fail on its first poll. Build the commit: label the release PR \`force-build\` if build-unitycloud.yml built nothing, or remove a \`windows-only\`/\`macos-only\` label that narrowed its targets. Then start \`In-World Tests\` by hand against ${BRANCH_NAME}. Do not re-run this workflow — it force-pushes ${BRANCH_NAME} and would re-cut the release from a newer dev tip."
            exit 0
          fi

          # Loud but deliberately not fatal. `gh workflow run` needs
          # `actions: write`, which ORG_ACCESS_TOKEN's other uses in this repo
          # (org membership, PR reviews) do not require, so it may not have it —
          # and a secret's scopes cannot be inspected from here. Failing the job
          # would invite a re-run, and re-running this workflow force-pushes the
          # release branch, quietly re-cutting the release from a newer dev tip.
          # The branch, PR, labels and CI status comment have all landed by
          # now; the annotation is what makes the missing gate visible, and the
          # required check staying unreported is what keeps the release blocked.
          if ! gh workflow run in-world-tests.yml --ref "$BRANCH_NAME"; then
            echo "::error::Could not dispatch the InWorld gate against ${BRANCH_NAME}. The likeliest cause is that ORG_ACCESS_TOKEN lacks \`actions: write\` on this repository, which \`gh workflow run\` requires. The release branch and its PR are fine — start \`In-World Tests\` by hand from the Actions tab against ${BRANCH_NAME}, or its required check will sit unreported and the release will not be mergeable."
            exit 0
          fi
          echo "::notice::InWorld gate dispatched against ${BRANCH_NAME}."
