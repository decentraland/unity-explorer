# pr-comment-warnings.yml
---
name: Comment Warning Ratchet on PR

# Runs in the trusted base-repo context alongside the (possibly fork) "Unity Test"
# workflow, so it can comment with write permissions without exposing them to the
# untrusted lint job. Mirrors pr-comment-artifact-url.yml.
#
# Writes only the "lint" section of the unified CI status comment via the
# ci-status-comment composite action (build / lint / tests live in one comment).
#
# 'requested' -> reset the lint section to "pending" the moment Unity Test starts,
#                so a stale Passed/Blocked state from a previous run never lingers.
# 'completed' -> ALWAYS refresh the section: Passed / Blocked / Skipped (no C#
#                changes) / Unavailable (lint did not finish).
on:
  workflow_run:
    types:
      - "requested"
      - "completed"
    workflows:
      - "Unity Test"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read       # needed by download-artifact@v4 to fetch warning-result from the Unity Test run

jobs:
  pending:
    if: github.event.action == 'requested' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        env:
          WORKFLOW_RUN_EVENT_OBJ: ${{ toJSON(github.event.workflow_run) }}
        run: |
          PR_NUMBER=$(jq -r '.pull_requests[0].number' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "PR number: $PR_NUMBER"
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "No PR associated with this run, skipping."
            echo "pr-number=" >> "$GITHUB_OUTPUT"
          else
            echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout CI status action
        if: steps.pr.outputs.pr-number != ''
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ci-status-comment
          sparse-checkout-cone-mode: false

      - name: Reset lint section to pending
        if: steps.pr.outputs.pr-number != ''
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ steps.pr.outputs.pr-number }}
          section: lint
          github-token: ${{ github.token }}
          body: |-
            ![Lint](https://img.shields.io/badge/Lint-Pending!-ffff00?logo=jetbrains&logoColor=white&style=for-the-badge)

            Lint in progress, come back later!

  comment:
    if: github.event.action == 'completed'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        env:
          WORKFLOW_RUN_EVENT_OBJ: ${{ toJSON(github.event.workflow_run) }}
        run: |
          PR_NUMBER=$(jq -r '.pull_requests[0].number' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "PR number: $PR_NUMBER"
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "No PR associated with this run, skipping."
            echo "pr-number=" >> "$GITHUB_OUTPUT"
          else
            echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Download warning result artifact
        if: steps.pr.outputs.pr-number != ''
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: warning-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Parse result
        if: steps.pr.outputs.pr-number != '' && steps.download.outcome == 'success'
        id: result
        run: |
          if [ ! -f warning-result.json ]; then
            echo "No warning-result.json found, treating as absent."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(jq -r '.count' warning-result.json)
          baseline=$(jq -r '.baseline // ""' warning-result.json)
          allow_equal=$(jq -r '.allow_equal // false' warning-result.json)
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "allow-equal=$allow_equal" >> "$GITHUB_OUTPUT"

      # Always compose a body, even when the artifact is absent (lint skipped or the
      # Unity Test run failed before counting), so the banner never goes stale.
      - name: Compose comment body
        if: steps.pr.outputs.pr-number != ''
        id: body
        env:
          FOUND: ${{ steps.result.outputs.found }}
          COUNT: ${{ steps.result.outputs.count }}
          BASELINE: ${{ steps.result.outputs.baseline }}
          ALLOW_EQUAL: ${{ steps.result.outputs.allow-equal }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          DELIM="EOF_$(uuidgen)"
          BADGE_STYLE="?logo=jetbrains&logoColor=white&style=for-the-badge"
          DETAILS=""
          BLOCKED=0

          # COUNT/BASELINE come from the artifact produced by the untrusted pull_request job
          # (fork-controlled). This step has no `set -e`, and bash's `[` errors out on a
          # non-numeric operand and falls through - never let such a value reach a comparison
          # or a bash arithmetic context ($(( )) evaluates its operands as expressions).
          [[ "$COUNT" =~ ^[0-9]+$ ]] || COUNT=0
          [[ "$BASELINE" =~ ^[0-9]+$ ]] || BASELINE=""

          if [ "$FOUND" != "true" ]; then
            if [ "$CONCLUSION" = "success" ]; then
              BADGE="https://img.shields.io/badge/Lint-Skipped-lightgrey${BADGE_STYLE}"
              MSG="No C# files changed — lint ratchet skipped."
            elif [ "$CONCLUSION" = "skipped" ]; then
              BADGE="https://img.shields.io/badge/Lint-Skipped-lightgrey${BADGE_STYLE}"
              MSG="Lint ratchet not evaluated for this run."
            else
              BADGE="https://img.shields.io/badge/Lint-Unavailable-ff0000${BADGE_STYLE}"
              MSG="Lint did not finish (\`${CONCLUSION}\`) — the warning ratchet could not be evaluated. [See logs](${RUN_URL})."
            fi
          else
            if [ -z "$BASELINE" ]; then
              MSG="**Warnings counted: $COUNT** (no baseline established yet)"
              BADGE="https://img.shields.io/badge/Lint-Passed!-3fb950${BADGE_STYLE}"
            elif [ "$COUNT" -lt "$BASELINE" ]; then
              MSG="**Warnings count reduced: $BASELINE => $COUNT**"
              BADGE="https://img.shields.io/badge/Lint-Passed!-3fb950${BADGE_STYLE}"
            elif [ "$ALLOW_EQUAL" = "true" ] && [ "$COUNT" -eq "$BASELINE" ]; then
              MSG="**Warnings unchanged: $BASELINE => $COUNT** — allowed on release/hotfix branches."
              BADGE="https://img.shields.io/badge/Lint-Passed!-3fb950${BADGE_STYLE}"
            else
              need=$((COUNT - BASELINE + 1))
              if [ "$need" -eq 1 ]; then noun="warning"; else noun="warnings"; fi
              MSG="**Warnings not reduced: $BASELINE => $COUNT** — remove at least $need $noun to merge."
              BADGE="https://img.shields.io/badge/Lint-Blocked!-ff0000${BADGE_STYLE}"
              BLOCKED=1
            fi

            # One collapsible block. Primary: warnings in files this PR changed. Fallback
            # (branch clean but still blocked): a general list of easy-to-remove warnings
            # from anywhere, so the dev has concrete targets to get under the baseline.
            total=$(jq -r '.pr_findings_total // 0' warning-result.json)
            [[ "$total" =~ ^[0-9]+$ ]] || total=0
            if [ "$total" -gt 0 ]; then
              {
                echo ""
                echo "<details><summary>Warnings/errors in files changed by this PR ($total)</summary>"
                echo ""
                echo '```'
                jq -r '.pr_findings[] | "\(.file):\(.line)  \(.rule)  \(.message | gsub("[\r\n]"; " "))"' warning-result.json
                shown=$(jq -r '.pr_findings | length' warning-result.json)
                if [ "$total" -gt "$shown" ]; then
                  echo ""
                  echo "…and $((total - shown)) more (see the csharp-lint-reports artifact)."
                fi
                echo '```'
                echo ""
                echo "</details>"
              } > details.md
              DETAILS="details.md"
            elif [ "$BLOCKED" = 1 ]; then
              dcount=$(jq -r '.droppable | length' warning-result.json)
              if [ "$dcount" -gt 0 ]; then
                {
                  echo ""
                  echo "<details><summary>No warnings in files changed by this PR — showing general ones you can remove to unblock ($dcount of $COUNT)</summary>"
                  echo ""
                  echo '```'
                  jq -r '.droppable[] | "\(.file):\(.line)  \(.rule)  \(.message | gsub("[\r\n]"; " "))"' warning-result.json
                  echo '```'
                  echo ""
                  echo "</details>"
                } > details.md
                DETAILS="details.md"
              fi
            fi
          fi

          {
            echo "body<<$DELIM"
            echo "![Lint]($BADGE)"
            echo ""
            echo "$MSG"
            [ -n "$DETAILS" ] && cat "$DETAILS"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout CI status action
        if: steps.pr.outputs.pr-number != ''
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ci-status-comment
          sparse-checkout-cone-mode: false

      - name: Update lint section
        if: steps.pr.outputs.pr-number != ''
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ steps.pr.outputs.pr-number }}
          section: lint
          github-token: ${{ github.token }}
          body: ${{ steps.body.outputs.body }}
