name: Avatar Preview Renderer Release

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump from the latest avatar-preview-renderer/v* tag'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 'Explicit version (X.Y.Z) — overrides bump when set'
        required: false
        default: ''
        type: string

concurrency:
  group: avatar-preview-renderer-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      commit_sha: ${{ steps.get_version.outputs.commit_sha }}
    steps:
      - name: Enforce release ref
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::Renderer releases are cut from dev only. This run is on '${{ github.ref }}'."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          fetch-tags: true

      - name: Compute version
        id: get_version
        run: |
          set -euo pipefail
          # The fallback covers the window before the first monorepo release tag exists
          # (the standalone repo left off at v2.8.0).
          LAST_TAG=$(git describe --tags --match 'avatar-preview-renderer/v*' --abbrev=0 2>/dev/null || echo 'avatar-preview-renderer/v2.8.0')
          LAST=${LAST_TAG#avatar-preview-renderer/v}
          echo "Last released version: $LAST"

          EXPLICIT="${{ github.event.inputs.version }}"
          if [ -n "$EXPLICIT" ]; then
            [[ "$EXPLICIT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version '$EXPLICIT' is not X.Y.Z"; exit 1; }
            NEXT="$EXPLICIT"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LAST"
            case "${{ github.event.inputs.bump }}" in
              major) NEXT="$((MAJOR + 1)).0.0" ;;
              minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          fi

          if git rev-parse -q --verify "refs/tags/avatar-preview-renderer/v$NEXT" >/dev/null; then
            echo "::error::Tag avatar-preview-renderer/v$NEXT already exists."
            exit 1
          fi

          echo "Releasing version: $NEXT from $GITHUB_SHA"
          echo "version=$NEXT" >> $GITHUB_OUTPUT
          echo "tag=avatar-preview-renderer/v$NEXT" >> $GITHUB_OUTPUT
          echo "commit_sha=$GITHUB_SHA" >> $GITHUB_OUTPUT

      - name: Write job summary
        run: |
          echo "## Avatar Preview Renderer Release" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.get_version.outputs.version }}\` | **Tag:** \`${{ steps.get_version.outputs.tag }}\` | **Commit:** \`${{ steps.get_version.outputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12.3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/avatar-preview-renderer/requirements.txt

      - name: Execute Unity Cloud build
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 180
          max_attempts: 3
          retry_on: any
          retry_wait_seconds: 30
          on_retry_command: |
            echo "::warning::🔁 Unity Cloud Build retry triggered at $(date '+%Y-%m-%d %H:%M:%S')"
          command: |
            echo "🔧 Starting Unity Cloud Build attempt at $(date '+%Y-%m-%d %H:%M:%S')"
            python -u scripts/avatar-preview-renderer/build.py
        env:
          API_KEY: ${{ secrets.UNITY_CLOUD_API_KEY }}
          ORG_ID: ${{ secrets.UNITY_CLOUD_ORG_ID }}
          PROJECT_ID: ${{ secrets.AVATAR_PREVIEW_RENDERER_UNITY_CLOUD_PROJECT_ID }}
          POLL_TIME: 60
          GLOBAL_TIMEOUT: 10800
          TARGET: t_web
          REF_NAME: release-${{ needs.prepare.outputs.version }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
          BUILD_OPTIONS: ''
          CLEAN_BUILD: true
          CACHE_STRATEGY: none
          IS_RELEASE_BUILD: true
          PARAM_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          PARAM_UNITY_EXTRA_PARAMS: '-disable-assembly-updater'

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: avatar-preview-renderer
          path: build
          if-no-files-found: error

      - name: Upload cloud logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: avatar-preview-renderer-unity-log
          path: unity_cloud_log.log
          if-no-files-found: error

      - name: Print cloud logs
        if: always()
        run: cat unity_cloud_log.log

      - name: Cancel Unity Cloud build
        if: ${{ failure() || cancelled() }}
        env:
          API_KEY: ${{ secrets.UNITY_CLOUD_API_KEY }}
          ORG_ID: ${{ secrets.UNITY_CLOUD_ORG_ID }}
          PROJECT_ID: ${{ secrets.AVATAR_PREVIEW_RENDERER_UNITY_CLOUD_PROJECT_ID }}
        run: python -u scripts/avatar-preview-renderer/build.py --cancel

  release:
    name: Tag and GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v7
        with:
          name: avatar-preview-renderer
          path: build

      - name: Zip build output
        run: |
          zip -r avatar-preview-renderer-v${{ needs.prepare.outputs.version }}.zip build/

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit_sha }}
          name: Avatar Preview Renderer v${{ needs.prepare.outputs.version }}
          # Auto-generated notes would span the whole monorepo, not just the renderer.
          generate_release_notes: false
          # The repo's "latest release" pointer belongs to Explorer releases —
          # s3-latest-release.yml publishes it to the launcher's latest.json.
          make_latest: false
          body: |
            Avatar Preview Renderer v${{ needs.prepare.outputs.version }}

            Built from `${{ needs.prepare.outputs.commit_sha }}` (dev).
          draft: false
          prerelease: false
          files: avatar-preview-renderer-v${{ needs.prepare.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy_production:
    name: Vercel Production
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for project link/config)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: false

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Download built artifact
        uses: actions/download-artifact@v7
        with:
          name: avatar-preview-renderer
          path: .vercel/output/static

      - name: Flatten artifact to static root
        run: |
          set -euo pipefail
          ROOT=".vercel/output/static"
          shopt -s dotglob nullglob
          for d in "avatar-preview-renderer" "AvatarPreviewRenderer" "build" "Build"; do
            if [ -d "$ROOT/$d" ] && [ -f "$ROOT/$d/index.html" ]; then
              echo "Flattening $ROOT/$d -> $ROOT"
              mv "$ROOT/$d"/* "$ROOT"/
              rmdir "$ROOT/$d" || true
              break
            fi
          done
          test -f "$ROOT/index.html" || { echo "::error::index.html not found at $ROOT"; exit 1; }

      - name: Copy vercel.json into static folder
        run: cp avatar-preview-renderer/vercel.json .vercel/output/static/vercel.json

      - name: Deploy static folder to Vercel (Production)
        id: vercel_deploy
        run: |
          url=$(vercel deploy .vercel/output/static --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"

      - name: Write job summary
        run: |
          {
            echo '## Avatar Preview Renderer v${{ needs.prepare.outputs.version }} deployed to production'
            echo
            echo '| Field      | Value |'
            echo '| ---------- | ----- |'
            echo '| Production | ${{ steps.vercel_deploy.outputs.url }} |'
            echo '| Commit     | `${{ needs.prepare.outputs.commit_sha }}` |'
          } >> "$GITHUB_STEP_SUMMARY"
