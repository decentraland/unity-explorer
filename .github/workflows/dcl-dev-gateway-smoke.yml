name: Camera Reel clipboard check
on:
  push:
    branches: [qa/camera-reel-viewer-2070]
permissions:
  contents: read
jobs:
  photo:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      AUDIT_BUILD_URL: https://explorer-artifacts.decentraland.org/@dcl/unity-explorer/branch/fix/camera-reel-viewer-links/wd-28137-e0162af/Decentraland_windows64.zip
      AUDIT_SLICE: personal_camera
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            qa-audit
            .claude/skills/pulse-face-to-face/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow playwright pywin32
      - run: python -B qa-audit/runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-detail-check
          path: |
            evidence/personal_camera/photo-result.json
            evidence/personal_camera/photo-browser.png
            evidence/personal_camera/personal-photo-detail.png
            evidence/personal_camera/personal-photo-copied-link.png
            evidence/personal_camera/personal-observations.json
            evidence/personal_camera/player-errors.txt
          retention-days: 7
