name: Unity dcl.dev screen audit
on:
  push:
    branches: [qa/dcl-dev-gateway-login-ed38dde]
permissions:
  contents: read
jobs:
  audit:
    name: Audit ${{ matrix.screen }}
    runs-on: windows-2025
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        screen: ["personal_faq", "personal_camera", "social_passport"]
    env:
      AUDIT_BUILD_URL: https://explorer-artifacts.decentraland.org/@dcl/unity-explorer/branch/feat/realm-scene-pointers-pulse-server/pr-28112-7469fb4/Decentraland_windows64.zip
      AUDIT_SLICE: ${{ matrix.screen }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            qa-audit
            .claude/skills/pulse-face-to-face/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pillow playwright pywin32
      - run: python -B qa-audit/runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-audit-${{ matrix.screen }}
          path: evidence/
          retention-days: 10

  macos:
    name: macOS gateway startup
    runs-on: macos-15
    timeout-minutes: 15
    env:
      AUDIT_BUILD_URL: https://explorer-artifacts.decentraland.org/@dcl/unity-explorer/branch/feat/realm-scene-pointers-pulse-server/pr-28112-7469fb4/Decentraland_macos.zip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: qa-audit
      - run: python3 -B qa-audit/mac_login.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-audit-macos
          path: evidence/
          retention-days: 10
