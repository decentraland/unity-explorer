name: S3 Latest Release

# Keeps @dcl/<repo>/releases/latest.json in sync with the repo's current
# latest release. Publishing, editing, and deleting all funnel through the
# same logic: resolve the latest release *after* the event and write it.
# Re-publishing or editing an older release rewrites the same (unchanged)
# latest version - idempotent by design.
on:
  release:
    types:
      - published
      - edited
      - deleted

jobs:
  update-latest-json:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve current latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Empty when no release remains (e.g. the only release was deleted) -
          # the update is skipped instead of writing a bogus version.
          LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          echo "tag=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Current latest release: ${LATEST:-<none>}"

      - name: Update latest.json on S3
        if: steps.latest.outputs.tag != ''
        env:
          AWS_MAX_ATTEMPTS: 3
          AWS_RETRY_MODE: standard
          AWS_ACCESS_KEY_ID: ${{ secrets.EXPLORER_TEAM_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY }}
          EXPLORER_TEAM_S3_BUCKET: ${{ secrets.EXPLORER_TEAM_S3_BUCKET }}
          RELEASES_PATH: ${{ format('@dcl/{0}/releases', github.event.repository.name) }}
          LATEST_RELEASE: ${{ steps.latest.outputs.tag }}
        run: |
          jq -n --arg v "$LATEST_RELEASE" --arg t "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{version: $v, timestamp: $t}' > latest.json
          cat latest.json
          aws s3 cp latest.json "s3://$EXPLORER_TEAM_S3_BUCKET/$RELEASES_PATH/latest.json"
