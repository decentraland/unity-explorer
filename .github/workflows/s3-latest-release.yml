name: S3 Latest Release

on:
  release:
    types: 
      - published
      - edited

jobs:
  check-latest-release:
    # Avatar Preview Renderer releases live in this repo too but never own latest.json.
    if: ${{ !startsWith(github.event.release.tag_name, 'avatar-preview-renderer/') }}
    runs-on: ubuntu-latest
    container:
      image: amazon/aws-cli:latest
    outputs:
      is_latest_release: ${{ steps.check_latest.outputs.is_latest_release }}
      latest_release: ${{ steps.check_latest.outputs.latest_release }}
    steps:
      - name: Install jq
        run: |
          yum update -y
          yum install -y jq

      - name: Check if current release is the latest release
        id: check_latest
        run: |
          RELEASE_TAG=$(jq -r .release.tag_name "$GITHUB_EVENT_PATH")
          echo "Release Tag: $RELEASE_TAG"

          # Get the latest release from the API
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          echo "Latest Release: $LATEST_RELEASE"

          # Set output for is_latest_release based on comparison
          if [ "$RELEASE_TAG" == "$LATEST_RELEASE" ]; then
            echo "is_latest_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest_release=false" >> $GITHUB_OUTPUT
          fi

          echo "latest_release=$LATEST_RELEASE" >> $GITHUB_ENV
          echo "latest_release=$LATEST_RELEASE" >> $GITHUB_OUTPUT

      - name: Run actions if release is the latest
        if: steps.check_latest.outputs.is_latest_release == 'true'
        env:
          AWS_MAX_ATTEMPTS: 3
          AWS_RETRY_MODE: standard
          AWS_ACCESS_KEY_ID: ${{ secrets.EXPLORER_TEAM_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY }}
          EXPLORER_TEAM_S3_BUCKET: ${{ secrets.EXPLORER_TEAM_S3_BUCKET }}
          RELEASES_PATH: ${{ format('@dcl/{0}/releases', github.event.repository.name) }}
        run: |
          echo '{
            "version": "${{ env.latest_release }}",
            "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
          }' > latest.json
          aws s3 cp latest.json s3://$EXPLORER_TEAM_S3_BUCKET/$RELEASES_PATH/latest.json

  # Delta patches: keep exactly two series, the ones into the release just published and
  # into the one it replaced (a grace period for downloads in flight and a rollback target
  # for on-delete-release.yml). Older series are removed; the sweep window also cleans up
  # after missed runs. Only on `published`: then the new release is the newest by
  # published_at, while on `edited` GitHub's /releases/latest may not be, and ranking
  # could reach the live release. A job of its own because actions/checkout needs git,
  # which the aws-cli container above lacks. See docs/delta-updates.md.
  prune-delta-patches:
    needs: check-latest-release
    if: needs.check-latest-release.outputs.is_latest_release == 'true' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout delta scripts
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/delta

      - name: Prune old delta patches
        env:
          AWS_MAX_ATTEMPTS: 3
          AWS_RETRY_MODE: standard
          AWS_ACCESS_KEY_ID: ${{ secrets.EXPLORER_TEAM_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY }}
          EXPLORER_TEAM_S3_BUCKET: ${{ secrets.EXPLORER_TEAM_S3_BUCKET }}
          RELEASES_PATH: ${{ format('@dcl/{0}/releases', github.event.repository.name) }}
          GH_TOKEN: ${{ github.token }}
          LATEST_RELEASE: ${{ needs.check-latest-release.outputs.latest_release }}
          DELTA_KEEP_SERIES: 2
          DELTA_PRUNE_WINDOW: 5
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | bash scripts/delta/release-tags.sh prune "$DELTA_KEEP_SERIES" "$DELTA_PRUNE_WINDOW" > prune.txt
          while IFS= read -r tag; do
            if [ "$tag" = "$LATEST_RELEASE" ]; then
              echo "::warning::Not pruning $tag: it is the live release."
              continue
            fi
            echo "Removing delta patches into $tag"
            aws s3 rm --recursive --only-show-errors "s3://$EXPLORER_TEAM_S3_BUCKET/$RELEASES_PATH/$tag/delta/"
          done < prune.txt
