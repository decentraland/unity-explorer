# ci-scripts-tests.yml
---
name: CI Scripts Tests

# Tests for the CI plumbing itself: build.py's pure helpers (including the
# URL_RE drift guard against ucb-build-links), the unified status comment's
# upsert script, the no-op-build-run probe that decides whether a Unity
# Cloud Build run may write that comment and the resolver that says which PR a
# run reports into, all against a stubbed gh, plus the delta update tool (lint,
# strict types, unit tests and synthetic builds). Cheap, and network-free apart
# from downloading the pinned HDiffPatch release and Python packages, so it runs
# on any PR touching these paths.
on:
  pull_request:
    paths:
      - "scripts/cloudbuild/**"
      - ".github/actions/ci-status-comment/**"
      - ".github/actions/ucb-build-links/**"
      - ".github/workflows/ci-scripts-tests.yml"
      - "scripts/delta/**"
      - ".github/workflows/build-release-delta.yml"
      - ".github/workflows/s3-latest-release.yml"
      - ".github/workflows/on-delete-release.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Unit tests (build.py helpers)
        run: |
          pip install --quiet -r scripts/cloudbuild/requirements.txt
          python3 -m unittest discover -s scripts/cloudbuild -v

      - name: Functional tests (upsert-ci-status.sh, stubbed gh)
        run: bash .github/actions/ci-status-comment/test-upsert-ci-status.sh

      - name: Functional tests (build-run-attempted.sh, stubbed gh)
        run: bash .github/actions/ci-status-comment/test-build-run-attempted.sh

      - name: Functional tests (resolve-comment-pr.sh, stubbed gh)
        run: bash .github/actions/ci-status-comment/test-resolve-comment-pr.sh

  # On Linux and on macOS (BSD file system semantics, case-insensitive APFS).
  delta:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: scripts/delta
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/delta

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the delta tool's dependencies
        run: pip install --quiet -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Types (mypy strict, pydantic plugin)
        run: mypy .

      - name: Tests (pinned HDiffPatch)
        run: |
          PATH="$(python3 run.py fetch-tools "$RUNNER_TEMP/hdiffpatch"):$PATH"
          python3 -m pytest
