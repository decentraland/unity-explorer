# ci-scripts-tests.yml
---
name: CI Scripts Tests

# Tests for the CI plumbing itself: build.py's pure helpers (including the
# URL_RE drift guard against ucb-build-links), the unified status comment's
# upsert script, the no-op-build-run probe that decides whether a Unity
# Cloud Build run may write that comment and the resolver that says which PR a
# run reports into, all against a stubbed gh, plus the delta update scripts on
# synthetic builds. Cheap, and network-free apart from downloading the pinned
# HDiffPatch release, so it runs on any PR touching these paths.
on:
  pull_request:
    paths:
      - "scripts/cloudbuild/**"
      - ".github/actions/ci-status-comment/**"
      - ".github/actions/ucb-build-links/**"
      - ".github/workflows/ci-scripts-tests.yml"
      - "scripts/delta/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Unit tests (build.py helpers)
        run: |
          pip install --quiet -r scripts/cloudbuild/requirements.txt
          python3 -m unittest discover -s scripts/cloudbuild -v

      - name: Functional tests (upsert-ci-status.sh, stubbed gh)
        run: bash .github/actions/ci-status-comment/test-upsert-ci-status.sh

      - name: Functional tests (build-run-attempted.sh, stubbed gh)
        run: bash .github/actions/ci-status-comment/test-build-run-attempted.sh

      - name: Functional tests (resolve-comment-pr.sh, stubbed gh)
        run: bash .github/actions/ci-status-comment/test-resolve-comment-pr.sh

      - name: Functional tests (release-tags.sh, check-unpublished.sh)
        run: bash scripts/delta/test-release-tags.sh

      - name: Functional tests (delta scripts, pinned HDiffPatch)
        run: |
          PATH="$(bash scripts/delta/fetch-tools.sh "$RUNNER_TEMP/hdiffpatch"):$PATH"
          bash scripts/delta/test-delta.sh

  # The macOS delta leg runs these scripts with BSD tools on a case-insensitive APFS
  # volume. A shim puts the stock /bin/bash 3.2 first on PATH, so nested `bash` calls
  # use it too instead of a Homebrew bash.
  delta-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/delta

      - name: Functional tests (delta scripts on macOS, stock bash 3.2)
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          PATH="$RUNNER_TEMP/bash32:$PATH"
          bash --version | head -1
          PATH="$(bash scripts/delta/fetch-tools.sh "$RUNNER_TEMP/hdiffpatch"):$PATH"
          bash scripts/delta/test-delta.sh
          bash scripts/delta/test-release-tags.sh
