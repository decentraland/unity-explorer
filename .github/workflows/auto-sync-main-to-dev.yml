name: Create PR for syncing main to dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Create or update branch
        run: |
          git checkout -B chore/sync
          git push --force --set-upstream origin chore/sync

      - name: Create pull request using GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base dev \
            --head chore/sync \
            --title "chore: sync main to dev" \
            --body $':crown: *An automated PR*\n\n> [!IMPORTANT]\n> This PR must be merged **by an admin, as a merge commit** ("Merge pull request", bypassing the linear-history rule) — never squash or rebase it.\n> Squashing rewrites the synced commits, which makes `main` and `dev` diverge and breaks future auto-syncs.\n> The `enforce-approvals` required check stays red until an admin approves this PR.' \
            --label auto-pr \
            || echo "Sync PR already exists — branch was updated, existing PR now points at the new commits."
