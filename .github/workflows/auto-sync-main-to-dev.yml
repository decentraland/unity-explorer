name: Create PR for syncing main to dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Create or update branch
        run: |
          git checkout -B chore/sync
          git push --force --set-upstream origin chore/sync

      - name: Create pull request using GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base dev \
            --head chore/sync \
            --title "chore: sync main to dev" \
            --body $':crown: *An automated PR*\n\n> [!IMPORTANT]\n> This PR will be merged automatically **as a merge commit** once it is approved and all required checks pass — do NOT squash or rebase.\n> Squashing rewrites the synced commits, which makes `main` and `dev` diverge and breaks future auto-syncs.' \
            --label auto-pr

      - name: Enable auto-merge as a merge commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge chore/sync --merge --auto
