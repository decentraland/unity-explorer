name: RustSegment Native Build


on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_LFS_GLOB: 'Explorer/Assets/Plugins/RustSegment/SegmentServerWrap/Libraries/**'
  LOCK: scripts/rust-segment/rust-segment-binaries.lock.json
  NATIVE: Explorer/Assets/Plugins/RustSegment/.native

jobs:
  gate:
    name: Should this run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'build-rust-segment-native') }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$LABELLED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: Build macos-universal
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - run: git lfs pull --include "$PLUGIN_LFS_GLOB"

      # In .native/, always: rustup reads .native/rust-toolchain.toml there,
      # and nowhere else in this checkout. At the repo root every rustc/cargo/
      # rustup command below would address the runner image's default
      # toolchain instead of the pinned one the build compiles with, so the
      # slices would be added to the wrong toolchain and the recorded
      # identities would name a compiler that produced none of the bytes -
      # the identities Gate B then pins reproduction against.
      - name: Install both Rust slices
        working-directory: ${{ env.NATIVE }}
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          # The x86_64 slice is the leg that dies when a rustc without that std
          # is first on PATH, and it dies inside cargo talking about a missing
          # crate rather than about the toolchain. Say so here instead.
          sysroot="$(rustc --print sysroot)"
          for slice in aarch64-apple-darwin x86_64-apple-darwin; do
            if [ ! -d "$sysroot/lib/rustlib/$slice/lib" ]; then
              echo "::error::the pinned rustc ($(rustc --version), sysroot $sysroot) has no $slice std; the universal build cannot work"
              exit 1
            fi
          done

      # rustc and cargo are asked from .native/ for the reason above; the file
      # itself is written at the repo root, where Gate B and the upload expect
      # it. Nothing else here is toolchain-file sensitive.
      - name: Record the toolchain actually used
        run: |
          set -uo pipefail
          {
            echo "rustc: $(cd "$NATIVE" && rustc --version)"
            echo "cargo: $(cd "$NATIVE" && cargo --version)"
            echo "clang: $(clang --version | head -1)"
            echo "xcode: $(xcodebuild -version | tr '\n' ' ' | sed 's/ *$//')"
            echo "sdk: macosx$(xcrun --sdk macosx --show-sdk-version) ($(xcrun --sdk macosx --show-sdk-build-version))"
            echo "ld: $(ld -v 2>&1 | head -1 || true)"
          } | tee toolchain-macos.txt

      - name: Gate A - the same runner must build the same bytes twice
        run: bash scripts/rust-segment/repro-gate.sh macos-universal

      - name: Gate B - reproduce the committed binaries, toolchain permitting
        run: python3 scripts/rust-segment/reproduces-lock.py macos-universal --toolchain toolchain-macos.txt

      - name: Compare the fresh build against the lock
        run: python3 scripts/rust-segment/verify-binaries.py --report macos-universal

      # always(): a round that fails a gate is exactly the round whose fresh
      # hashes and recorded toolchain someone needs to read. Without this the
      # job that found the problem hands back nothing to diagnose it with.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-segment-macos-universal
          path: |
            Explorer/Assets/Plugins/RustSegment/SegmentServerWrap/Libraries/Mac/*.dylib
            toolchain-macos.txt
            rust-segment-macos-universal.sha256
          if-no-files-found: error

  windows:
    name: Build windows-x86_64
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - run: git lfs pull --include "$PLUGIN_LFS_GLOB"

      # In .native/, always - see the macOS job's note: rustup honours
      # .native/rust-toolchain.toml only there, so at the repo root this would
      # target the runner image's default toolchain and record a compiler that
      # built none of the shipped bytes.
      - name: Install the Rust target
        working-directory: ${{ env.NATIVE }}
        run: |
          set -euo pipefail
          rustup target add x86_64-pc-windows-msvc
          # build.sh hardcodes the triple and the deterministic-link flags in
          # .cargo/config.toml hang off it, so the lock has to agree with it
          # rather than be assumed to.
          pinned=$(python - <<'PY'
          import json, os, sys
          sys.stdout.reconfigure(newline="\n")
          print(json.load(open(os.environ["LOCK"]))["targets"]["windows-x86_64"]["rust"]["target"])
          PY
          )
          if [ "$pinned" != "x86_64-pc-windows-msvc" ]; then
            echo "::error::the lock pins rust target '$pinned' but .native/build.sh builds x86_64-pc-windows-msvc"
            exit 1
          fi

      # rustc and cargo are asked from .native/ - see the macOS job's note.
      # The MSVC toolset is what link.exe comes from: rustc finds it on its
      # own, so no vcvars shell names it; vswhere does, the same way
      # verify-binaries.py's `msvc` probe reads it back at relock time.
      - name: Record the toolchain actually used
        run: |
          set -uo pipefail
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          install=$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
          msvc=$(tr -d '\r\n' < "$(cygpath -u "$install")/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt")
          {
            echo "rustc: $(cd "$NATIVE" && rustc --version)"
            echo "cargo: $(cd "$NATIVE" && cargo --version)"
            echo "msvc: $msvc"
          } | tee toolchain-windows.txt

      - name: Gate A - the same runner must build the same bytes twice
        run: bash scripts/rust-segment/repro-gate.sh windows-x86_64

      - name: Gate B - reproduce the committed binaries, toolchain permitting
        run: python scripts/rust-segment/reproduces-lock.py windows-x86_64 --toolchain toolchain-windows.txt

      - name: Compare the fresh build against the lock
        run: python scripts/rust-segment/verify-binaries.py --report windows-x86_64

      # always(): see the macOS job's note.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-segment-windows-x86_64
          path: |
            Explorer/Assets/Plugins/RustSegment/SegmentServerWrap/Libraries/Windows/*.dll
            toolchain-windows.txt
            rust-segment-windows-x86_64.sha256
          if-no-files-found: error

  publish:
    name: Publish manifest
    needs: [macos, windows]
    if: always() && needs.macos.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          path: built

      - name: Assemble the release manifest
        run: |
          set -euo pipefail
          mkdir -p manifest
          cp "$LOCK" manifest/rust-segment-binaries.lock.json
          cat built/*/*.sha256 > manifest/SHA256SUMS
          cat built/*/toolchain-*.txt > manifest/TOOLCHAINS.txt
          {
            echo "### RustSegment native build"
            echo
            echo '```'
            cat manifest/SHA256SUMS
            echo '```'
            echo
            echo '```'
            cat manifest/TOOLCHAINS.txt
            echo '```'
            echo
            echo '> [!WARNING]'
            echo "> **Nothing was committed** — this workflow has \`contents: read\` and only verifies. If this build is meant to ship, follow the relock steps in \`Explorer/Assets/Plugins/RustSegment/README.md\`: commit the binaries from this run's artifacts, then run \`scripts/rust-segment/verify-binaries.py --update --only <target> --toolchain toolchain-<os>.txt\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: rust-segment-manifest
          path: manifest
          if-no-files-found: error
