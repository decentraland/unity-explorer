# build-release-delta.yml
---
name: Release Delta Patches

# Generates per-file HDiffPatch patches from each of the last N published releases
# into <tag>, plus their manifest, and uploads them next to the release zip:
#   releases/<tag>/delta/<platform>/manifest.json
#   releases/<tag>/delta/<platform>/from/<base tag>/<path>.hdiff
# A failed platform or base only leaves that patch set out. Logic lives in
# scripts/delta/ (python3 scripts/delta/run.py --help). Design: docs/delta-updates.md
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag the patches lead to (e.g. v0.187.0-alpha)'
        required: true
        type: string
      base_count:
        description: 'How many previous published releases get a patch set'
        required: false
        type: number
        default: 4
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag the patches lead to (e.g. v0.187.0-alpha). Must not be published yet.'
        required: true
        type: string
      base_count:
        description: 'How many previous published releases get a patch set'
        required: false
        type: number
        default: 4

permissions:
  contents: read

concurrency:
  group: release-delta-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  RELEASES_PATH: ${{ format('@dcl/{0}/releases', github.event.repository.name) }}

jobs:
  plan:
    name: Pick base releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A delta failure must never block the release.
    continue-on-error: true
    outputs:
      bases: ${{ steps.bases.outputs.bases }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/delta

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the delta tool's dependencies
        run: pip install --quiet -r scripts/delta/requirements.txt

      # Patches are immutable once the release is published.
      - name: Refuse a published or invalid tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/delta/run.py check-unpublished "$TAG"

      - name: Pick base releases
        id: bases
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_COUNT: ${{ inputs.base_count }}
        run: |
          set -euo pipefail
          BASES="$(python3 scripts/delta/run.py bases "$BASE_COUNT" "$TAG")"
          echo "Bases for $TAG: $BASES"
          echo "bases=$BASES" >> "$GITHUB_OUTPUT"

  delta:
    name: Delta (${{ matrix.platform }})
    needs: plan
    # `bases` is empty when the plan job failed (e.g. published tag), `[]` when there is nothing to diff against.
    if: needs.plan.outputs.bases != '' && needs.plan.outputs.bases != '[]'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Epic builds are not delta-updated: the Epic store ships its own updates.
          - platform: windows64
            runner: ubuntu-latest
            zip: Decentraland_windows64.zip
          # A macOS runner so the rebuilt .app can be checked with codesign.
          - platform: macos
            runner: macos-latest
            zip: Decentraland_macos.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PLATFORM: ${{ matrix.platform }}
      ZIP: ${{ matrix.zip }}
      BASES: ${{ needs.plan.outputs.bases }}
      AWS_MAX_ATTEMPTS: 3
      AWS_RETRY_MODE: standard
      AWS_ACCESS_KEY_ID: ${{ secrets.EXPLORER_TEAM_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY }}
      EXPLORER_TEAM_S3_BUCKET: ${{ secrets.EXPLORER_TEAM_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/delta

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the delta tool's dependencies
        run: pip install --quiet -r scripts/delta/requirements.txt

      - name: Install HDiffPatch (pinned)
        run: python3 scripts/delta/run.py fetch-tools "$RUNNER_TEMP/hdiffpatch" >> "$GITHUB_PATH"

      - name: Install osslsigncode
        if: matrix.platform == 'windows64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode > /dev/null

      # The published zip is the source of truth. A delta left by an earlier run of this
      # tag describes the zip it overwrote, so it is removed; the tag is re-checked first
      # because it may have been published while this leg was queued. The zip's ETag is
      # kept so the upload can refuse a zip replaced by a later build of the same tag.
      - name: Download the new release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/delta/run.py check-unpublished "$TAG"
          WORK="$RUNNER_TEMP/delta"
          mkdir -p "$WORK"
          aws s3 rm --recursive --only-show-errors "s3://$EXPLORER_TEAM_S3_BUCKET/$RELEASES_PATH/$TAG/delta/$PLATFORM/"
          ZIP_ETAG="$(aws s3api get-object --bucket "$EXPLORER_TEAM_S3_BUCKET" --key "$RELEASES_PATH/$TAG/$ZIP" \
            "$WORK/$ZIP" --query ETag --output text)"
          NEW_ROOT="$(python3 scripts/delta/run.py extract "$WORK/$ZIP" "$WORK/new")"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "NEW_ROOT=$NEW_ROOT" >> "$GITHUB_ENV"
          echo "ZIP_ETAG=$ZIP_ETAG" >> "$GITHUB_ENV"

      - name: Generate and verify patches per base
        run: |
          set -euo pipefail
          OUT="$WORK/out"
          FAILED_BASES=""
          mkdir -p "$OUT"
          echo "Signatures of the new build:"
          python3 scripts/delta/run.py signatures "$PLATFORM" "$NEW_ROOT"

          # A failing base is left out; the others still ship.
          for BASE_TAG in $(jq -r '.[]' <<< "$BASES"); do
            echo "::group::$BASE_TAG -> $TAG"
            BASE_ZIP="$WORK/base-$ZIP"
            if ! aws s3 cp --only-show-errors "s3://$EXPLORER_TEAM_S3_BUCKET/$RELEASES_PATH/$BASE_TAG/$ZIP" "$BASE_ZIP"; then
              echo "::warning::$BASE_TAG has no $ZIP in S3; skipping this base."
            elif ! python3 scripts/delta/run.py delta-for-base "$TAG" "$PLATFORM" "$NEW_ROOT" "$WORK/$ZIP" "$BASE_TAG" "$BASE_ZIP" "$OUT"; then
              echo "::error::$BASE_TAG: patch generation or verification failed; this base is left out of the manifest."
              FAILED_BASES="$FAILED_BASES $BASE_TAG"
            fi
            rm -f "$BASE_ZIP"
            echo "::endgroup::"
          done
          echo "FAILED_BASES=$FAILED_BASES" >> "$GITHUB_ENV"

          shopt -s nullglob
          BASE_FILES=("$OUT"/base-*.json)
          [ ${#BASE_FILES[@]} -gt 0 ] || { echo "::error::No base produced a patch set."; exit 1; }
          python3 scripts/delta/run.py manifest "$TAG" "$PLATFORM" "$NEW_ROOT" "$WORK/$ZIP" "${BASE_FILES[@]}" > "$WORK/manifest.json"

      - name: Refuse a tag published or a zip replaced in the meantime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/delta/run.py check-unpublished "$TAG"
          NOW_ETAG="$(aws s3api head-object --bucket "$EXPLORER_TEAM_S3_BUCKET" --key "$RELEASES_PATH/$TAG/$ZIP" \
            --query ETag --output text)"
          [ "$NOW_ETAG" = "$ZIP_ETAG" ] || { echo "::error::$ZIP changed in S3 during generation; not uploading."; exit 1; }

      # Manifest last, so it never references a patch not uploaded yet. Only the patches are
      # immutable: a rebuild of this unpublished tag rewrites the manifest under the same key.
      - name: Upload patches, then the manifest
        run: |
          set -euo pipefail
          DEST="$RELEASES_PATH/$TAG/delta/$PLATFORM"
          mkdir -p "$WORK/upload-patches" "$WORK/upload-manifest"
          mv "$WORK/out/from" "$WORK/upload-patches/from"
          cp "$WORK/manifest.json" "$WORK/upload-manifest/manifest.json"
          npx @dcl/cdn-uploader@next \
            --bucket "$EXPLORER_TEAM_S3_BUCKET" \
            --local-folder "$WORK/upload-patches" \
            --bucket-folder "$DEST" \
            --immutable \
            --variant uncompressed
          npx @dcl/cdn-uploader@next \
            --bucket "$EXPLORER_TEAM_S3_BUCKET" \
            --local-folder "$WORK/upload-manifest" \
            --bucket-folder "$DEST" \
            --variant uncompressed

      - name: Write job summary
        if: always() && env.WORK != ''
        run: |
          [ -f "$WORK/manifest.json" ] || exit 0
          # shellcheck disable=SC2086 # FAILED_BASES is a list of tags
          python3 scripts/delta/run.py summary "$WORK/manifest.json" ${FAILED_BASES:-} >> "$GITHUB_STEP_SUMMARY"
