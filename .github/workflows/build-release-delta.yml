# build-release-delta.yml
---
name: Release Delta Patches

# Generates per-file HDiffPatch patches from each of the last N published releases
# into <tag>, plus their manifest, and uploads them next to the release zip:
#   releases/<tag>/delta/<platform>/manifest.json
#   releases/<tag>/delta/<platform>/from/<base tag>/<path>.hdiff
# Each step below runs one workflow of the delta tool (scripts/delta, `delta --help`) on
# the run document: it must be in the stage the workflow follows, and moves to the next.
# A failing base is dropped; the others still ship. Design: docs/delta-updates.md
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag the patches lead to (e.g. v0.187.0-alpha)'
        required: true
        type: string
      base_count:
        description: 'How many previous published releases get a patch set'
        required: false
        type: number
        default: 4
    secrets:
      EXPLORER_TEAM_AWS_ACCESS_KEY_ID:
        required: true
      EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY:
        required: true
      EXPLORER_TEAM_S3_BUCKET:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag the patches lead to (e.g. v0.187.0-alpha). Must not be published yet.'
        required: true
        type: string
      base_count:
        description: 'How many previous published releases get a patch set'
        required: false
        type: number
        default: 4

permissions:
  contents: read

concurrency:
  group: release-delta-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  RELEASES_PATH: ${{ format('@dcl/{0}/releases', github.event.repository.name) }}

jobs:
  plan:
    name: Pick base releases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A delta failure must never block the release.
    continue-on-error: true
    outputs:
      bases: ${{ steps.bases.outputs.bases }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/delta
            .github/actions/delta-tool

      - uses: ./.github/actions/delta-tool

      # Patches are immutable once the release is published.
      - name: Refuse a published or invalid tag
        run: '"$DELTA" check-unpublished "$TAG"'

      - name: Pick base releases
        id: bases
        env:
          BASE_COUNT: ${{ inputs.base_count }}
        run: |
          set -euo pipefail
          BASES="$("$DELTA" bases "$BASE_COUNT" "$TAG")"
          echo "Bases for $TAG: $BASES"
          echo "bases=$BASES" >> "$GITHUB_OUTPUT"

  delta:
    name: Delta (${{ matrix.platform }})
    needs: plan
    # `bases` is empty when the plan job failed (e.g. published tag), `[]` when there is nothing to diff against.
    if: needs.plan.outputs.bases != '' && needs.plan.outputs.bases != '[]'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Epic builds are not delta-updated: the Epic store ships its own updates.
          - platform: windows64
            runner: ubuntu-latest
            zip: Decentraland_windows64.zip
          # A macOS runner so the rebuilt .app can be checked with codesign.
          - platform: macos
            runner: macos-latest
            zip: Decentraland_macos.zip
    runs-on: ${{ matrix.runner }}
    # Above the sum of the step timeouts: a hung step fails (absorbed by continue-on-error)
    # instead of cancelling the job.
    timeout-minutes: 260
    env:
      PLATFORM: ${{ matrix.platform }}
      ZIP: ${{ matrix.zip }}
      BASES: ${{ needs.plan.outputs.bases }}
      GH_TOKEN: ${{ github.token }}
      AWS_MAX_ATTEMPTS: 3
      AWS_RETRY_MODE: standard
      AWS_ACCESS_KEY_ID: ${{ secrets.EXPLORER_TEAM_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY }}
      EXPLORER_TEAM_S3_BUCKET: ${{ secrets.EXPLORER_TEAM_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/delta
            .github/actions/delta-tool

      - uses: ./.github/actions/delta-tool

      - name: Install HDiffPatch (pinned)
        timeout-minutes: 5
        run: '"$DELTA" fetch-tools "$RUNNER_TEMP/hdiffpatch" >> "$GITHUB_PATH"'

      - name: Install osslsigncode
        if: matrix.platform == 'windows64'
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode > /dev/null

      - name: Start the run
        run: |
          echo "RUN=$RUNNER_TEMP/delta/run.json" >> "$GITHUB_ENV"
          "$DELTA" start "$RUNNER_TEMP/delta/run.json" --tag "$TAG" --platform "$PLATFORM" --zip "$ZIP" \
            --releases "$RELEASES_PATH" --bases "$BASES" --work "$RUNNER_TEMP/delta/work"

      - name: Confirm the release is unpublished
        timeout-minutes: 5
        run: '"$DELTA" step confirm-unpublished "$RUN"'

      - name: Clear patches of an earlier run of this tag
        timeout-minutes: 5
        run: '"$DELTA" step clear-stale "$RUN"'

      - name: Download the target and base zips
        timeout-minutes: 20
        run: '"$DELTA" step download "$RUN"'

      - name: Extract the builds
        timeout-minutes: 20
        run: '"$DELTA" step extract "$RUN"'

      - name: Inspect the builds
        timeout-minutes: 20
        run: '"$DELTA" step inspect "$RUN"'

      - name: Encode the patch sets
        timeout-minutes: 90
        run: '"$DELTA" step encode "$RUN"'

      - name: Verify the patch sets like the launcher
        timeout-minutes: 40
        run: '"$DELTA" step verify "$RUN"'

      - name: Assemble the manifest
        timeout-minutes: 10
        run: '"$DELTA" step assemble "$RUN"'

      - name: Recheck the release and its zip
        timeout-minutes: 5
        run: '"$DELTA" step recheck "$RUN"'

      - name: Upload the patches
        timeout-minutes: 20
        run: '"$DELTA" step upload-patches "$RUN"'

      - name: Publish the manifest
        timeout-minutes: 5
        run: '"$DELTA" step publish-manifest "$RUN"'

      - name: Write job summary
        if: always() && env.RUN != ''
        run: '[ ! -f "$RUN" ] || "$DELTA" summary "$RUN" >> "$GITHUB_STEP_SUMMARY"'

      - name: Keep the run document
        if: always() && env.RUN != ''
        uses: actions/upload-artifact@v6
        with:
          name: delta-run-${{ matrix.platform }}
          path: ${{ env.RUN }}
          if-no-files-found: ignore
          retention-days: 14
