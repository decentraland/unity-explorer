# pr-comment-artifact-url.yml
---
name: Delete Artifact URL in PR

on:
  workflow_run:
    types:
      - "requested"
    workflows:
      - "Unity Cloud Build"
    branches-ignore:
      - "main"

permissions:
  contents: read
  pull-requests: write

jobs:
  pre-validation:
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.check-pr.outputs.pr-number }}
    steps:
      - name: Check if PR number exists
        id: check-pr
        env:
          WORKFLOW_RUN_EVENT_OBJ: ${{ toJSON(github.event.workflow_run) }}
        run: |
          PR_NUMBER=$(jq -r '.pull_requests[0].number' <<< "$WORKFLOW_RUN_EVENT_OBJ")
          echo "Pull request Number: $PR_NUMBER"
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            echo "PR_NUMBER is not set, skipping comment update."
            exit 0
          fi
          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

  delete-comment:
    needs: pre-validation
    if: needs.pre-validation.outputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI status action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/ci-status-comment
          sparse-checkout-cone-mode: false
      - name: Reset build section to pending
        uses: ./.github/actions/ci-status-comment
        with:
          pr-number: ${{ needs.pre-validation.outputs.pr-number }}
          section: build
          github-token: ${{ github.token }}
          body: |-
            ![Build](https://img.shields.io/badge/Build-Pending!-ffff00?logo=github&style=for-the-badge)  <img src="https://ui.decentraland.org/decentraland_256x256.png" width="30">

            New build in progress, come back later!
